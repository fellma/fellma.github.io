<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>관리자 · 효성집수리</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div id="loginView" class="login-wrap">
      <form id="loginForm" class="login-card">
        <p class="eyebrow">ADMIN</p>
        <h1>관리자 로그인</h1>
        <p class="hint">알려드리는 글과 명함 문구를 여기서 고칩니다.</p>
        <label>
          비밀번호
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <p id="loginError" class="error" hidden></p>
        <button type="submit" class="btn">들어가기</button>
        <a class="back" href="index.html">홈으로</a>
      </form>
    </div>

    <div id="appView" class="app" hidden>
      <header class="admin-bar">
        <a href="index.html" class="brand">효성집수리</a>
        <strong>관리자</strong>
        <button type="button" id="logoutBtn" class="text-btn">로그아웃</button>
      </header>

      <nav class="tabs" aria-label="관리 메뉴">
        <button type="button" class="tab is-on" data-tab="notice">알려드립니다</button>
        <button type="button" class="tab" data-tab="settings">명함</button>
      </nav>

      <section id="panel-notice" class="panel">
        <h2 id="noticeFormHeading">글 수정</h2>
        <form id="noticeForm" class="card-form">
          <input type="hidden" name="id" />
          <label>날짜 <input type="date" name="date" required /></label>
          <div class="editor-head">
            <strong>휴대폰에서 보이는 그대로 수정</strong>
            <p class="hint">글자를 드래그해서 선택한 다음, 아래 버튼으로 굵게·강조·색상을 넣을 수 있습니다. 제목과 본문은 엔터로 줄을 나눕니다.</p>
          </div>
          <div class="format-bar" id="formatBar">
            <button type="button" data-fmt="bold" title="굵게"><b>가</b></button>
            <button type="button" data-fmt="highlight" title="강조">강조</button>
            <button type="button" data-fmt="underline" title="밑줄"><u>밑줄</u></button>
            <button type="button" data-fmt="remove" title="서식 지우기">지우기</button>
            <span class="swatches" aria-label="글자 색">
              <button type="button" class="swatch" data-color="#1c1612" title="검정" style="background:#1c1612"></button>
              <button type="button" class="swatch" data-color="#8b5e3c" title="갈색" style="background:#8b5e3c"></button>
              <button type="button" class="swatch" data-color="#9b2c2c" title="빨강" style="background:#9b2c2c"></button>
              <button type="button" class="swatch" data-color="#c45c26" title="주황" style="background:#c45c26"></button>
              <button type="button" class="swatch" data-color="#2f6b3a" title="초록" style="background:#2f6b3a"></button>
              <button type="button" class="swatch" data-color="#1d4e89" title="파랑" style="background:#1d4e89"></button>
            </span>
          </div>
          <div class="phone-stage">
            <div class="phone-frame">
              <textarea class="title-as-page" name="title" required maxlength="160" rows="2" placeholder="글 제목"></textarea>
              <div class="notice-panel-edit">
                <div id="noticeBlocks" class="notice-blocks"></div>
              </div>
            </div>
          </div>
          <div class="row wrap">
            <button type="button" id="addTextBlock" class="btn ghost">글 칸 추가</button>
            <button type="button" id="addImageBlock" class="btn ghost">사진 추가</button>
          </div>
          <input type="file" id="imagePicker" accept="image/*" hidden />
          <label class="check"><input type="checkbox" name="pinned" /> 상단 고정</label>
          <div class="row wrap">
            <button type="submit" class="btn">저장</button>
            <button type="button" id="noticeReset" class="btn ghost">새로 작성</button>
          </div>
          <p id="noticeOk" class="ok" hidden></p>
          <p id="githubHint" class="hint">저장하면 GitHub 홈페이지에도 자동으로 올라갑니다.</p>
        </form>
        <h2>등록된 글</h2>
        <div id="noticeAdminList" class="stack"></div>
      </section>

      <section id="panel-settings" class="panel" hidden>
        <h2>모바일 명함</h2>
        <form id="settingsForm" class="card-form">
          <label>명함 맨 위 문구 <textarea name="cardHeadline" rows="3" required></textarea></label>
          <label>상호 <input name="companyName" required /></label>
          <label>이름 <input name="ownerName" required /></label>
          <label>직함 <input name="ownerTitle" placeholder="대표" /></label>
          <label>업종 한 줄 <input name="cardTagline" placeholder="전기 · 목공 인테리어" /></label>
          <label>짧은 소개 <textarea name="cardIntro" rows="4" required></textarea></label>
          <label>전화번호 <input name="phone" placeholder="010-8204-0998" /></label>
          <label>상담 시간 <input name="hours" /></label>
          <label>시공 지역 <input name="area" /></label>
          <label>시공 사진 안내 문구 <input name="blogCta" placeholder="시공 이미지를 보고 싶으시다면?" /></label>
          <label>네이버 블로그 주소 <input name="blogUrl" placeholder="https://m.blog.naver.com/tmfhomerepair" /></label>
          <label>명함 사진 <input type="file" name="photo" accept="image/*" /></label>
          <p class="hint">사진을 바꾸지 않으면 지금 캐릭터 이미지가 유지됩니다.</p>
          <button type="submit" class="btn">명함 저장</button>
          <p id="settingsOk" class="ok" hidden></p>
        </form>
      </section>
    </div>

    <script src="js/rich-text.js"></script>
    <script src="js/github-admin.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
